<svg width="220" height="56" viewBox="0 0 220 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Price tag (rounded diamond) -->
  <g transform="translate(28,28)">
    <rect x="-20" y="-20" width="40" height="40" rx="8" transform="rotate(45)" fill="#f4501c"/>
    <!-- Hole -->
    <circle cx="-13" cy="-13" r="4" fill="rgba(255,255,255,0.75)"/>
    <!-- Clock face -->
    <circle cx="2" cy="4" r="13" fill="white"/>
    <circle cx="2" cy="4" r="9" stroke="#f4501c" stroke-width="1.8" fill="none"/>
    <!-- Hour hand -->
    <line x1="2" y1="4" x2="2" y2="-3" stroke="#f4501c" stroke-width="2" stroke-linecap="round"/>
    <!-- Minute hand -->
    <line x1="2" y1="4" x2="7" y2="5.5" stroke="#f4501c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="2" cy="4" r="1.5" fill="#f4501c"/>
  </g>
  <!-- FırsatVakti -->
  <text x="64" y="23" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="19" fill="#1a1a2e" letter-spacing="-0.3">Fırsat</text>
  <text x="64" y="44" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="19" fill="#1a1a2e" letter-spacing="-0.3">Vakti<tspan fill="#f4501c">.com</tspan></text>
  <!-- Tagline -->
  <text x="64" y="54" font-family="Arial, sans-serif" font-weight="600" font-size="7.5" fill="#888899" letter-spacing="1.5">İNDİRİM FIRSATLARI</text>
</svg>
