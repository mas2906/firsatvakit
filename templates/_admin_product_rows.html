{% for p in products %}
          <tr data-pid="{{ p.id }}" style="border-top:1px solid var(--border);transition:background .1s;" onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background='transparent'">
            <td style="padding:12px 16px;color:var(--muted);font-size:12px;">#{{ p.id }}</td>
            <td style="padding:12px 16px;max-width:320px;">
              <div style="font-weight:500;color:var(--text);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;">{{ p.title or '(başlık yok — taranıyor)' }}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px;">{{ p.source_url }}</div>
            </td>
            <td style="padding:12px 16px;">
              <span class="badge-{{ p.platform }}" style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;">{{ p.platform|title }}</span>
            </td>
            <td style="padding:12px 16px;font-size:12px;white-space:nowrap;">{% with st=p.stock, qty=p.stock_qty %}{% include "_admin_stock.html" %}{% endwith %}</td>
            <td style="padding:12px 16px;text-align:right;font-weight:600;color:var(--text);">{{ p.price_count }}</td>
            <td style="padding:12px 16px;text-align:center;">
              <button onclick="deleteProduct({{ p.id }}, this)" style="padding:5px 14px;background:#fef2f2;border:none;border-radius:7px;font-size:12px;font-weight:700;color:#dc2626;cursor:pointer;">🗑 Ürünü Sil</button>
            </td>
          </tr>
{% else %}
<tr><td colspan="6"style="padding:24px 16px;text-align:center;color:var(--muted);font-size:13px;">Ürün bulunamadı</td></tr>
{% endfor %}
